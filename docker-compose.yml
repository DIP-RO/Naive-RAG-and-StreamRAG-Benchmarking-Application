services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_NAME: Assessment Agent
      ENVIRONMENT: dev
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      API_KEY_OPEN_ROUTER: ${API_KEY_OPEN_ROUTER:-}
      GEMMA_API_KEY_OPEN_ROUTER: ${GEMMA_API_KEY_OPEN_ROUTER:-}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-openrouter}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-google/gemma-4-31b-it:free}
      QDRANT_URL: http://qdrant:6333
      SQLITE_PATH: /data/assessment.db
    volumes:
      - backend-data:/data
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - postgres

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

  qdrant:
    image: qdrant/qdrant:v1.11.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: assessment
      POSTGRES_USER: assessment
      POSTGRES_PASSWORD: assessment
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  backend-data:
  qdrant-data:
  postgres-data:
